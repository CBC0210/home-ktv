# Home KTV — Nginx configuration
# Used when running behind Nginx instead of (or alongside) Cloudflare Tunnel.
# Typically Cloudflare Tunnel handles external TLS; Nginx handles local routing.

upstream ktv_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

upstream ktv_frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS redirect (only if Nginx handles TLS directly)
server {
    listen 80;
    server_name ktv.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ktv.example.com;

    # TLS — provided by Cloudflare origin certificate or Let's Encrypt
    # ssl_certificate     /etc/ssl/certs/ktv.example.com.crt;
    # ssl_certificate_key /etc/ssl/private/ktv.example.com.key;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws {
        proxy_pass http://ktv_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;    # Keep WS alive
        proxy_send_timeout 86400s;
    }

    # ── Backend API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://ktv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Streaming (audio / lyrics / HLS) ────────────────────────────────────
    location /songs/ {
        proxy_pass http://ktv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;       # Stream without buffering
        proxy_read_timeout 300s;
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://ktv_backend;
        access_log off;
    }

    # ── Frontend (Next.js) ───────────────────────────────────────────────────
    location / {
        proxy_pass http://ktv_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;

        # Cache static assets from Next.js
        location /_next/static/ {
            proxy_pass http://ktv_frontend;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
